<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <title>authserver</title>
    <!-- Start the UI font download in parallel with the bundle; main.tsx waits for it before the first render. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/src/fonts/fira-code-latin-wght-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/src/fonts/fira-code-latin-ext-wght-normal.woff2"
    />
    <!-- Paint the pure black shell color before any stylesheet or script arrives (no flash). -->
    <style>
      html,
      body {
        margin: 0;
        background: #000000;
        color: #eaeaea;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
