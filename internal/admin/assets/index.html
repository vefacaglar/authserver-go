<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<title>go-authserver admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ .CSRFToken }}">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Local Tailwind & Lucide Libraries -->
<script src="/admin/assets/js/libs/tailwind.min.js"></script>
<script src="/admin/assets/js/libs/lucide.min.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
          heading: ['Outfit', 'sans-serif'],
        },
        colors: {
          zinc: {
            950: '#09090b',
          }
        }
      }
    }
  }
</script>
<style>
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  h1, h2, h3, .heading-font {
    font-family: 'Outfit', sans-serif;
  }
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  .dark ::-webkit-scrollbar-thumb {
    background: #27272a;
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb {
    background: #e4e4e7;
    border-radius: 9999px;
  }
</style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-800 dark:text-zinc-200 min-h-screen flex flex-col md:flex-row transition-colors duration-200">

<!-- SIDEBAR -->
<aside class="w-full md:w-64 bg-white dark:bg-zinc-900 border-b md:border-b-0 md:border-r border-zinc-200 dark:border-zinc-800 flex flex-col shrink-0">
  <div class="h-16 px-6 border-b border-zinc-200 dark:border-zinc-800 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
        <i data-lucide="shield-check" class="w-4 h-4"></i>
      </div>
      <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-zinc-900 to-zinc-600 dark:from-white dark:to-zinc-400 bg-clip-text text-transparent">go-authserver</span>
    </div>
    <span class="text-[10px] font-semibold tracking-wider uppercase px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-600 dark:text-indigo-400">admin</span>
  </div>

  <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
    <button data-tab="dashboard" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800">
      <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview
    </button>
    <div class="h-px bg-zinc-200 dark:bg-zinc-800 my-2"></div>
    <button data-tab="clients" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800">
      <i data-lucide="app-window" class="w-4 h-4"></i> Clients
    </button>
    <button data-tab="scopes" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800">
      <i data-lucide="key-round" class="w-4 h-4"></i> Scopes
    </button>
    <button data-tab="users" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800">
      <i data-lucide="users" class="w-4 h-4"></i> Users
    </button>
    <button data-tab="roles" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800">
      <i data-lucide="shield" class="w-4 h-4"></i> Roles
    </button>
    <div class="h-px bg-zinc-200 dark:bg-zinc-800 my-2"></div>
    <button data-tab="sessions" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800">
      <i data-lucide="laptop" class="w-4 h-4"></i> Sessions
    </button>
    <button data-tab="refresh-tokens" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800">
      <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh Tokens
    </button>
    <button data-tab="keys" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800">
      <i data-lucide="key" class="w-4 h-4"></i> Signing Keys
    </button>
    <button data-tab="audit" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800">
      <i data-lucide="file-text" class="w-4 h-4"></i> Audit Logs
    </button>
  </nav>

  <!-- SIDEBAR FOOTER (AUTH CONTROLS) -->
  <div class="p-4 border-t border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/50">
    <div class="flex items-center justify-between mb-3">
      <span class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Security State</span>
      <button id="theme-toggle" class="p-1.5 rounded-lg bg-zinc-200 dark:bg-zinc-800 hover:bg-zinc-300 dark:hover:bg-zinc-700 text-zinc-600 dark:text-zinc-400 transition-colors">
        <i data-lucide="sun" class="w-4 h-4 dark:hidden"></i>
        <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
      </button>
    </div>
    <button id="btn-show-token-modal" class="w-full flex items-center justify-between p-2.5 rounded-lg bg-white dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 text-left hover:border-zinc-300 dark:hover:border-zinc-700 transition-all">
      <div class="flex items-center gap-2">
        <span class="relative flex h-2 w-2">
          <span id="auth-ping-glowing" class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"></span>
          <span id="auth-ping-solid" class="relative inline-flex rounded-full h-2 w-2"></span>
        </span>
        <div class="overflow-hidden">
          <p class="text-xs font-semibold text-zinc-800 dark:text-zinc-200" id="auth-status-title">Auth status</p>
          <p class="text-[10px] text-zinc-400 truncate" id="auth-status-desc">Loading</p>
        </div>
      </div>
      <i data-lucide="settings" class="w-3.5 h-3.5 text-zinc-400"></i>
    </button>
  </div>
</aside>

<!-- MAIN CONTENT WRAPPER -->
<main class="flex-1 flex flex-col overflow-hidden">
  <!-- TOP NAV BAR -->
  <header class="h-16 px-6 md:px-8 border-b border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-4">
      <h2 id="current-tab-title" class="text-xl font-bold tracking-tight text-zinc-900 dark:text-white">Dashboard</h2>
      <div id="health-badge" class="hidden md:flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        OIDC Server Healthy
      </div>
    </div>
    <div class="flex items-center gap-3">
      <!-- Quick API Docs / Discovery Endpoint Link -->
      <a href="/.well-known/openid-configuration" target="_blank" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-800 text-xs font-medium text-zinc-600 dark:text-zinc-300 transition-colors">
        <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Discovery
      </a>
      <a href="/.well-known/jwks.json" target="_blank" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-800 text-xs font-medium text-zinc-600 dark:text-zinc-300 transition-colors">
        <i data-lucide="key" class="w-3.5 h-3.5"></i> JWKS
      </a>
    </div>
  </header>

  <!-- CONTENT CONTAINER -->
  <div id="content" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6">
    <p class="text-zinc-400">loading dashboard…</p>
  </div>
</main>

<!-- PREMIUM TOKEN INPUT MODAL -->
<dialog id="token-modal" class="bg-transparent backdrop:bg-zinc-950/60 p-4 w-full max-w-md">
  <form id="token-form" class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-6 shadow-2xl space-y-5 text-zinc-800 dark:text-zinc-200" onsubmit="event.preventDefault();">
    <div class="flex items-start justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
          <i data-lucide="key" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="font-bold text-lg leading-tight">Admin Token</h3>
          <p class="text-xs text-zinc-400">Paste your Bearer token for server authorization</p>
        </div>
      </div>
      <button type="button" onclick="document.getElementById('token-modal').close()" class="p-1 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 transition-colors">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
    
    <div class="space-y-3">
      <div class="space-y-1">
        <input type="text" name="username" value="admin" autocomplete="username" class="hidden">
        <label for="admin-token" class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Token Bearer</label>
        <input id="admin-token" type="password" name="admin_token" autocomplete="current-password" class="w-full px-3 py-2 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 dark:text-white" placeholder="paste admin token (leave blank if anonymous)">
      </div>
      <div id="modal-token-status" class="text-xs"></div>
    </div>

    <div class="flex items-center justify-end gap-2 pt-2 border-t border-zinc-200 dark:border-zinc-800">
      <button type="button" onclick="document.getElementById('token-modal').close()" class="px-4 py-2 rounded-lg text-sm font-semibold hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">Cancel</button>
      <button type="submit" id="token-save" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold shadow-md shadow-indigo-500/10 transition-colors">Apply</button>
    </div>
  </form>
</dialog>

<script type="module" src="/admin/assets/js/app.js"></script>
</body>
</html>
