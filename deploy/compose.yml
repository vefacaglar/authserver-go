name: authserver

services:
  authserver:
    image: ${AUTH_IMAGE:?Set AUTH_IMAGE to the published image digest}
    restart: unless-stopped
    init: true
    env_file:
      - path: ./authserver.env
        format: raw
    environment:
      AUTH_ISSUER: https://auth.vefacaglar.com
      AUTH_PUBLIC_URL: https://auth.vefacaglar.com
      AUTH_LISTEN_ADDR: :5175
      AUTH_REQUIRE_HTTPS: "true"
      AUTH_DB_DRIVER: postgres
      AUTH_AUTO_MIGRATE: "false"
      AUTH_SEED: "false"
      AUTH_ADMIN_ALLOW_ANONYMOUS: "false"
      AUTH_DEV_LOG_EMAILS: "false"
    ports:
      - "127.0.0.1:${AUTH_BIND_PORT:-5175}:5175"
    networks:
      backend:
        aliases: [authserver]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:5175/.well-known/jwks.json"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The browser SPA (web/), served as static files by its own Caddy.
  # The main Caddy routes non-API paths on auth.vefacaglar.com here.
  web:
    image: ${AUTH_WEB_IMAGE:?Set AUTH_WEB_IMAGE to the published web image digest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${AUTH_WEB_BIND_PORT:-5176}:8080"
    networks:
      backend:
        aliases: [web]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /data:size=16m
      - /config:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    external: true
    name: ${AUTH_DOCKER_NETWORK:?Set AUTH_DOCKER_NETWORK to the existing proxy/database network}
