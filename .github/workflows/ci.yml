name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authserver-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Real OIDC client smoke test
        run: RUN_SMOKE=1 go test -tags m8smoke -count=1 -run TestSmoke_RealOIDCClient ./test/...
      - name: Check deployment scripts
        run: |
          bash -n deploy/deploy.sh deploy/receive.sh scripts/ssh-deploy.sh scripts/ci-container-smoke.sh
          shellcheck deploy/deploy.sh deploy/receive.sh scripts/ssh-deploy.sh scripts/ci-container-smoke.sh
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate generated Caddy route
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import runpy
          proxy = runpy.run_path('deploy/configure-caddy.py')
          config = proxy['updated_config']('existing.example.test {\n    respond ok\n}\n', 'authserver:5175', False)
          (Path(os.environ['RUNNER_TEMP']) / 'authserver-test-Caddyfile').write_text(config)
          PY
          docker run --rm --mount "type=bind,src=$RUNNER_TEMP/authserver-test-Caddyfile,dst=/etc/caddy/Caddyfile,readonly" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}@${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build image for runtime checks
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: authserver:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify PostgreSQL migration and production container
        run: bash scripts/ci-container-smoke.sh authserver:ci
      - name: Image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AUTH_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://auth.vefacaglar.com
    env:
      AUTH_IMAGE: ${{ needs.image.outputs.image }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$KNOWN_HOSTS"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [[ -n "$SSH_KEY" ]]; then
            printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/authserver-ssh-key"
            chmod 600 "$RUNNER_TEMP/authserver-ssh-key"
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends sshpass
          fi
      - name: Prepare configuration from GitHub secrets
        env:
          AUTH_ENV: ${{ secrets.AUTH_ENV }}
          AUTH_DB_DSN: ${{ secrets.AUTH_DB_DSN }}
          AUTH_ADMIN_TOKEN: ${{ secrets.AUTH_ADMIN_TOKEN }}
          AUTH_SMTP_HOST: ${{ secrets.AUTH_SMTP_HOST }}
          AUTH_SMTP_PORT: ${{ secrets.AUTH_SMTP_PORT }}
          AUTH_SMTP_USERNAME: ${{ secrets.AUTH_SMTP_USERNAME }}
          AUTH_SMTP_PASSWORD: ${{ secrets.AUTH_SMTP_PASSWORD }}
          AUTH_SMTP_FROM: ${{ secrets.AUTH_SMTP_FROM }}
          AUTH_DOCKER_NETWORK: ${{ vars.AUTH_DOCKER_NETWORK || 'databases_default' }}
          AUTH_BIND_PORT: ${{ vars.AUTH_BIND_PORT || '5175' }}
          AUTH_CADDY_CONTAINER: ${{ vars.AUTH_CADDY_CONTAINER }}
          AUTH_CADDY_CONFIG_PATH: ${{ vars.AUTH_CADDY_CONFIG_PATH }}
          REGISTRY_USER: ${{ github.actor }}
        run: python3 scripts/prepare-deploy.py "$RUNNER_TEMP/authserver-bundle"
      - name: Upload configuration and deploy published image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: bash scripts/ssh-deploy.sh
      - name: Verify public OIDC endpoints
        run: |
          # Pin the request to the VPS so a stale Render record cannot pass this gate.
          curl --connect-to "auth.vefacaglar.com:443:$VPS_HOST:443" --fail --silent --show-error --retry 24 --retry-delay 5 --retry-all-errors --retry-max-time 180 --max-time 10 https://auth.vefacaglar.com/.well-known/openid-configuration | jq -e '.issuer == "https://auth.vefacaglar.com"' > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 15 https://auth.vefacaglar.com/healthz > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 15 https://auth.vefacaglar.com/.well-known/openid-configuration | jq -e '.issuer == "https://auth.vefacaglar.com"' > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 15 https://auth.vefacaglar.com/.well-known/jwks.json | jq -e '(.keys | length) > 0 and all(.keys[]; has("d") | not)' > /dev/null
      - name: Remove temporary deployment credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/authserver-ssh-key"
          rm -rf "$RUNNER_TEMP/authserver-bundle"
